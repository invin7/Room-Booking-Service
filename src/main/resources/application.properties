spring.datasource.url=jdbc:postgresql://localhost:5432/roombooking
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
server.port=8080
management.endpoints.web.exposure.include=health

# Authentication. Set APP_JWT_SECRET (32+ chars) so logins survive restarts.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.ttl=PT12H
# First admin account, created at startup if set and not already present.
app.admin.email=${APP_ADMIN_EMAIL:}
app.admin.password=${APP_ADMIN_PASSWORD:}
app.seed-demo-rooms=${APP_SEED_DEMO_ROOMS:false}
spring.jpa.open-in-view=false
