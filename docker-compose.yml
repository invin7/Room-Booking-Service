version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: roombooking-postgres
    environment:
      POSTGRES_DB: roombooking
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d roombooking"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: roombooking-app
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/roombooking
      SPRING_DATASOURCE_USERNAME: test
      SPRING_DATASOURCE_PASSWORD: test
      # Demo defaults. Change the admin password, and set a real APP_JWT_SECRET (32+ chars),
      # before exposing this anywhere. Without a secret, logins are reset on every restart.
      APP_ADMIN_EMAIL: ${APP_ADMIN_EMAIL:-admin@example.com}
      APP_ADMIN_PASSWORD: ${APP_ADMIN_PASSWORD:-admin12345}
      APP_JWT_SECRET: ${APP_JWT_SECRET:-}
      APP_SEED_DEMO_ROOMS: ${APP_SEED_DEMO_ROOMS:-true}
volumes:
  postgres_data:
